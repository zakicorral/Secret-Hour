<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unlock</title>
<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  text-align: center;
  max-width: 400px;
}

h1 {
  margin-bottom: 20px;
}

input {
  padding: 10px;
  font-size: 1rem;
  text-align: center;
  width: 120px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  background: #111;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

.glow {
  text-shadow: 0 0 12px #00ffff;
}

.hidden {
  display: none;
}

.timer {
  font-size: 2rem;
}
</style>
</head>
<body>

<div class="container" id="app"></div>

<script>
const app = document.getElementById("app");
let step = 0;
let clues = [];

function render() {
  // PASSWORD GATE
  if (step === 0) {
    app.innerHTML = `
      <h1 class="glow">Enter the code</h1>
      <input id="input" placeholder="password">
      <br>
      <button onclick="checkPassword()">Unlock</button>
    `;
  }

  // PUZZLE 1
  if (step === 1) {
    app.innerHTML = `
      <h1>I move forward.<br>I never stop.<br>I end things so new ones start.</h1>
      <input id="input" placeholder="answer">
      <br>
      <button onclick="checkAnswer('time')">Submit</button>
    `;
  }

  // PUZZLE 2 (COUNTDOWN)
  if (step === 2) {
    app.innerHTML = `
      <h1 class="glow">Wait.</h1>
      <p class="timer" id="timer">60</p>
    `;
    startCountdown();
  }

  // PUZZLE 3 (TIME LOCK)
  if (step === 3) {
    app.innerHTML = `
      <h1>2025 → ?</h1>
      <p id="lockText">Some answers only exist at the right moment.</p>
      <input id="input" class="hidden">
      <br>
      <button id="btn" class="hidden" onclick="checkYear()">Submit</button>
    `;
    checkMidnight();
  }

  // FINAL REVEAL
  if (step === 4) {
    app.innerHTML = `
      <h1 class="glow">Unlocked.</h1>
      <p>Time reached zero.</p>
      <p>A new year unlocked.</p>
      <h2>Happy New Year 🎆</h2>
    `;
  }
}

function checkPassword() {
  const val = document.getElementById("input").value;
  if (val === "60") {
    step = 1;
    render();
  } else {
    alert("Wrong code.");
  }
}

function checkAnswer(correct) {
  const val = document.getElementById("input").value.toLowerCase();
  if (val === correct) {
    clues.push(correct.toUpperCase());
    step = 2;
    render();
  } else {
    alert("Try again.");
  }
}

function startCountdown() {
  let time = 60;
  const t = document.getElementById("timer");
  const interval = setInterval(() => {
    time--;
    t.textContent = time;
    if (time <= 0) {
      clearInterval(interval);
      clues.push("ZERO");
      step = 3;
      render();
    }
  }, 1000);
}

function checkMidnight() {
  const now = new Date();
  const unlock = new Date(now.getFullYear(), 11, 31, 24, 0, 0);

  if (now >= unlock) {
    document.getElementById("lockText").textContent = "Now.";
    document.getElementById("input").classList.remove("hidden");
    document.getElementById("btn").classList.remove("hidden");
  } else {
    setTimeout(checkMidnight, 1000);
  }
}

function checkYear() {
  const val = document.getElementById("input").value;
  if (val === "2026") {
    clues.push("2026");
    step = 4;
    render();
  } else {
    alert("Not yet.");
  }
}

render();
</script>

</body>
</html>
