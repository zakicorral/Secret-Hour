<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Search Puzzle</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fdf6e3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 {margin-bottom: 10px;}
#grid {display: grid; grid-template-columns: repeat(20, 30px); grid-gap: 2px; margin-bottom:20px;}
.cell {
  width:30px; height:30px;
  display:flex; justify-content:center; align-items:center;
  background: #eee;
  cursor:pointer;
  user-select:none;
  font-weight:bold;
}
.cell.selected {background:#ffa;}
.cell.found {background:#8f8; color:#fff; font-weight:bold;}
#words {margin-top:20px;}
#words span {display:inline-block; margin:0 5px 5px 0; padding:3px 6px; background:#ddd; border-radius:4px;}
#words span.found {background:#8f8; color:#fff;}
</style>
</head>
<body>

<h1>Word Search Puzzle</h1>
<p>Find all <span id="wordCount"></span> words!</p>
<div id="grid"></div>
<div id="words"></div>

<script>
// GRID DATA
const letters = [
"PDZQZHNUABYWRDHNRGWU",
"LJONLCUQRMHTLAHDHPSN",
"YTDKLPHAZZQZJRKVPSWE",
"WELIMSVSMGDHNYWWIQOI",
"BMXKWEQBMQUBLRIWTZV",
"AGIFREUDRFDXLNDXMBFB",
"PNPYVYPAOLVVBOSTEYRT",
"JQLPYIXZGKYFCVXJSNS",
"LFPXNKPPATOFTNGESHJE",
"HEDTUWRELTCZIOYOIDGI",
"QWLHAPPINESSPTJQTKXR",
"AKRFNFHDPHRXAQDUBLED",
"YWPVHTFWNXGCTFHAIYII",
"IURTSJKJXHGGIBHVECDK",
"OCNOJXQJQJEJIEIBMGBRW",
"POFNPDGXFJXYNWIOFKMM",
"PAMRPXLBMDXKCAKQLPIP",
"NCGWIUGHAYKHEXIMOCRB",
"FXSFHHXCQGRONLUMTCAA",
"MQMXPIKNPXQTM T BFFD E K"
];

// WORD LIST
const wordsToFind = ["HAPPINESS"]; // Add more words here

// RENDER GRID
const gridContainer = document.getElementById('grid');
const wordCountEl = document.getElementById('wordCount');
const wordsEl = document.getElementById('words');

wordCountEl.textContent = wordsToFind.length;

letters.forEach((row, r)=>{
  row.split('').forEach((letter,c)=>{
    const div = document.createElement('div');
    div.textContent = letter;
    div.className = 'cell';
    div.dataset.row = r;
    div.dataset.col = c;
    gridContainer.appendChild(div);
  });
});

// RENDER WORDS TO FIND
wordsToFind.forEach(word=>{
  const span = document.createElement('span');
  span.textContent = word;
  wordsEl.appendChild(span);
});

// INTERACTIVITY
let selecting = false;
let startCell = null;
let selectedCells = [];

function getCell(row,col){
  return document.querySelector(`.cell[data-row='${row}'][data-col='${col}']`);
}

gridContainer.addEventListener('mousedown', e=>{
  if(!e.target.classList.contains('cell')) return;
  selecting=true;
  startCell=e.target;
  selectedCells=[startCell];
  startCell.classList.add('selected');
});

gridContainer.addEventListener('mouseover', e=>{
  if(!selecting) return;
  if(!e.target.classList.contains('cell')) return;
  if(selectedCells.includes(e.target)) return;
  selectedCells.push(e.target);
  e.target.classList.add('selected');
});

document.addEventListener('mouseup', ()=>{
  if(!selecting) return;
  selecting=false;

  // CHECK SELECTED WORD
  const word = selectedCells.map(c=>c.textContent).join('');
  const reversed = selectedCells.map(c=>c.textContent).reverse().join('');
  const foundIndex = wordsToFind.findIndex(w=>w===word || w===reversed);
  if(foundIndex>=0){
    selectedCells.forEach(c=>{c.classList.add('found'); c.classList.remove('selected');});
    const spans = wordsEl.querySelectorAll('span');
    spans[foundIndex].classList.add('found');
    clues.push(word);
    alert(`You found "${wordsToFind[foundIndex]}"!`);
    if(clues.length===wordsToFind.length){
      alert("🎉 Congratulations! You found all words!");
    }
  } else {
    selectedCells.forEach(c=>c.classList.remove('selected'));
  }
  selectedCells=[];
});
</script>

</body>
</html>
